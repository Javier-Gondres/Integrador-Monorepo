services:
  postgres:
    image: postgres:latest

    container_name: integrador-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

      POSTGRES_DB: integrador

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
