name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Solo para prisma generate / tsc en CI (no se conecta a una BD real).
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable
      NEXT_PUBLIC_API_URL: http://localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm run format:check

      - name: ESLint
        run: pnpm turbo run lint

      - name: TypeScript
        run: pnpm turbo run check-types

      - name: Build
        run: pnpm turbo run build
